<!-- Headline card. Used inside the {{HEADLINE_SECTION}} block. -->
<!-- Distinguishing visual cues: 6px solid mango left border on the outer card frame, -->
<!-- navy-fill TLDR box, navy left border on 요약 + 용어 boxes, h2 22px title. -->
          <tr>
            <td style="padding:0 28px {{CARD_PADDING_BOTTOM}} 28px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;background-color:#FFFFFF;border:1px solid #D8D9E4;border-left:6px solid #FFB81C;">
                <tr>
                  <td style="padding:24px;">
                    <a href="{{ARTICLE_URL}}" style="color:#15182D;text-decoration:none;">
                      <h2 style="margin:0 0 16px 0;font-size:22px;line-height:30px;font-weight:bold;color:#15182D;" class="h-title">{{ARTICLE_TITLE}}</h2>
                    </a>
                    <div style="background-color:#15182D;padding:14px 16px;margin-bottom:16px;border-radius:4px;">
                      <div style="font-size:10px;font-weight:bold;color:#FFB81C;letter-spacing:2px;margin-bottom:8px;">TL;DR</div>
                      <div style="font-size:14px;font-weight:bold;color:#FFFFFF;">{{TLDR_TEXT}}</div>
                    </div>
                    <div style="background-color:#F1F1F5;border-left:3px solid #15182D;padding:12px 14px;margin-bottom:16px;">
                      <div style="font-size:10px;font-weight:bold;color:#15182D;letter-spacing:2px;margin-bottom:8px;">요약</div>
                      <ul style="margin:0;padding-left:20px;font-size:13px;line-height:22px;color:#4C4A49;">
{{SUMMARY_BULLETS_HTML}}
                      </ul>
                    </div>
{{JARGON_BLOCK}}
                  </td>
                </tr>
              </table>
            </td>
          </tr>
